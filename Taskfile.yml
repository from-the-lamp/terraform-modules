version: '3'

dotenv: [.env]
vars:
  OCI_REPO: registry.gitlab.com/from-the-lamp/infra/terraform-modules
  OCI_REPO_DEV: registry.gitlab.com/from-the-lamp/infra/terraform-modules
  DIFF_BASE:
    sh: |
      if [ -n "${DIFF_BASE:-}" ]; then
        echo "$DIFF_BASE"
        exit 0
      fi
      for c in "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" "${CI_COMMIT_BEFORE_SHA:-}"; do
        if [ -n "$c" ] && [ "$c" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$c^{commit}" 2>/dev/null; then
          echo "$c"
          exit 0
        fi
      done
      # Local/pre-commit fallback: "HEAD" is a sentinel GIT_DIFF_FLAGS below
      # keys off of, not just another ref. HEAD~1 looked equivalent but
      # breaks the moment HEAD is a merge commit - its first parent is "my
      # own tip before the merge", so everything the merge brought in from
      # the other side reads as "changed" (e.g. every renovate VERSION
      # bump pulled in by a `git pull`/merge from main).
      echo HEAD
  # Pre-commit hooks see the *staged* snapshot, not the full working tree -
  # --cached scopes the local fallback to that, so unrelated unstaged edits
  # elsewhere in the tree don't get swept into "changed" either. Empty in CI,
  # where DIFF_BASE is a real historical SHA and the checkout has nothing
  # staged anyway.
  GIT_DIFF_FLAGS:
    sh: |
      if [ "{{.DIFF_BASE}}" = "HEAD" ]; then
        echo "--cached"
      fi
  MODULE_DIRS:
    sh: find modules -type f -name "VERSION" -exec dirname {} \; | sed 's|^modules/||' | tr '\n' ' '
  CHANGED_MODULE_DIRS:
    sh: |
      if [ -n "${TARGETS:-}" ]; then
        echo "$TARGETS"
        exit 0
      fi
      git diff {{.GIT_DIFF_FLAGS}} --name-only --diff-filter=d {{.DIFF_BASE}} | grep '^modules/.*VERSION$' | xargs -r -n1 dirname | sed 's|^modules/||' | sort -u | tr '\n' ' '

includes:
  init:
    taskfile: .tasks/init.yml
    flatten: true
  build:
    taskfile: .tasks/build.yml
    flatten: true
  build_dev:
    taskfile: .tasks/build_dev.yml
    flatten: true
  readme:
    taskfile: .tasks/readme.yml
    flatten: true

silent: true
tasks:
  default:
    desc: List all available tasks
    cmd: task --list-all

  list:all:
    desc: List all Module directories
    cmd: echo {{.MODULE_DIRS}} | tr ' ' '\n'

  plan:
    desc: Show what CI would build and push from the current diff - diff base, changed modules, target OCI refs
    cmds:
      - echo -e "\033[36m==>\033[0m diff base {{.DIFF_BASE}} (override with DIFF_BASE=<ref>, or name modules with TARGETS=\"dir1 dir2\" - both as environment variables)"
      - |
        if [ -z "{{.CHANGED_MODULE_DIRS}}" ]; then
          echo -e "\033[36m==>\033[0m no VERSION changed - CI would build and push nothing"
          exit 0
        fi
        for d in {{.CHANGED_MODULE_DIRS}}; do
          echo "$d -> {{.OCI_REPO}}/$d:$(cat "modules/$d/VERSION")"
        done

  list:changed:
    desc: List changed Module directories
    cmd: echo {{.CHANGED_MODULE_DIRS}} | tr ' ' '\n'

  cleanup:
    desc: Remove temporary files
    cmds:
      - find . -type d -name ".output" -prune -exec rm -rf {} \;

  auth:
    desc: Login into GitLab Container Registry
    cmds:
      - echo "${OCI_REPO_PASS}" | oras login -u "${OCI_REPO_USER}" --password-stdin "${OCI_REGISTRY}"
